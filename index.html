<style>
/* VOICE: a collector's app — crisp, quick, a little manga.
   IDEA: the shelf itself: coloured tankōbon spines on black boards, gaps you can see.
   PICTURE: the shelf (spines per series) and real German covers per volume.
   COLOUR & TYPE: paper white + ink + hanko red; Dela Gothic One titles, Zen Kaku Gothic body.
   LAYOUT: app shell — sticky header, views, bottom tab bar with a red scan button. */
:root{
  --bg:#ffffff;--bg2:#f4f3f1;--card:#ffffff;--ink:#141317;--ink2:#55525b;--ink3:#8b8892;--line:#e6e4e1;
  --red:#e5322d;--red2:#fde8e6;--ok:#13814a;--ok2:#e2f3e9;--board:#141317;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px -14px rgba(0,0,0,.28);
  --r:14px;
  --fd:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --ft:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#111014;--bg2:#1c1b20;--card:#1b1a1f;--ink:#f4f2ef;--ink2:#bdb9c3;--ink3:#8c8893;--line:#2f2d34;
  --red:#ff4d40;--red2:#3b1714;--ok:#3ccf7d;--ok2:#11301f;--board:#55525c;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ft);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img.broken{display:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.muted{color:var(--ink3)}.small{font-size:13.5px}.red{color:var(--red)}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}

/* header & tabs */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.hanko{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font:19px/1 var(--fd);transform:rotate(-5deg)}
.brand h1{margin:0;font:22px/1 var(--fd)}
.tools{display:flex;gap:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--bg2)}
main{max-width:1180px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) calc(118px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,120px));justify-content:center;align-items:end;
  padding:6px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background:var(--card);border-top:1px solid var(--line)}
.tabs a{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:50px;color:var(--ink3);text-decoration:none;font-size:11px;font-weight:700}
.tabs a.on{color:var(--ink)}
.tabs a.on .ic{color:var(--red)}

.stats4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin:16px 0 10px}

.vt.miss .cv,.vt.up .cv{background:var(--bg2);box-shadow:inset 0 0 0 1.5px var(--ink3)}

.budget span{font-weight:700;opacity:.75;font-size:14px}

.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--ink3);text-align:center;padding-bottom:2px}

.cal .d.own{background:var(--ink);color:var(--bg)}

<script>
'use strict';
{
/* ================= barcode decoder (EAN-13 / ISBN) ================= */
/* EAN-13 / ISBN decoder for still photos and video frames. No dependencies.
   decode(gray, W, H, opt) -> {code, votes, err} | null
   gray: Uint8Array of W*H luminance values.
   Two run extractors per scan line (local threshold + gradient extrema) feed one pattern matcher. */
const EAN13 = (() => {
  const L = [[3,2,1,1],[2,2,2,1],[2,1,2,2],[1,4,1,1],[1,1,3,2],[1,2,3,1],[1,1,1,4],[1,3,1,2],[1,2,1,3],[3,1,1,2]];
  const G = L.map(p => p.slice().reverse());
  const PAR = ['LLLLLL','LLGLGG','LLGGLG','LLGGGL','LGLLGG','LGGLLG','LGGGLL','LGLGLG','LGLGGL','LGGLGL'];

  function check(c) {
    if (!/^\d{13}$/.test(c)) return false;
    let s = 0;
    for (let i = 0; i < 12; i++) s += (+c[i]) * (i % 2 ? 3 : 1);
    return (10 - s % 10) % 10 === +c[12];
  }

  function digit(w, o, pats) {
    const t = w[o] + w[o+1] + w[o+2] + w[o+3];
    if (!(t > 0)) return [-1, 99];
    const k = 7 / t;
    let best = 99, bi = -1;
    for (let d = 0; d < 10; d++) {
      const p = pats[d];
      const e = Math.abs(w[o]*k - p[0]) + Math.abs(w[o+1]*k - p[1]) + Math.abs(w[o+2]*k - p[2]) + Math.abs(w[o+3]*k - p[3]);
      if (e < best) { best = e; bi = d; }
    }

/* --- Statistik --- */
function vStats() {
  const list = seriesList();
  if (!list.length) return `<div class="empty"><h2>Noch keine Zahlen</h2><p>Sobald Bände im Regal stehen, siehst du hier Sammlungswert, Ausgaben, Lesestapel und mehr.</p><button class="btn dark" data-a="demo">Demo ansehen</button></div>`;
  const now = new Date(), year = String(now.getFullYear()), thick = num(D().settings.thick) || 1.6;
  let vols = 0, value = 0, unread = 0, priced = 0, priceSum = 0, complete = 0, yearN = 0, yearSum = 0, missN = 0, missSum = 0;
  const pubs = {}, status = { laufend: 0, abgeschlossen: 0, pausiert: 0 }, months = [], up = [];
  for (let i = 11; i >= 0; i--) { const d = new Date(now.getFullYear(), now.getMonth() - i, 1); months.push({ p: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, l: MON[d.getMonth()], n: 0, sum: 0 }); }
  for (let i = 0; i < 6; i++) { const d = new Date(now.getFullYear(), now.getMonth() + i, 1); up.push({ p: `${d.getFullYear()}-${pad(d.getMonth() + 1)}`, l: MON[d.getMonth()], n: 0, sum: 0 }); }
  const prog = [], sub = [];
  for (const s of list) {
    const I = info(s);
    vols += I.owned; value += I.value; unread += I.unread; if (I.complete) complete++;
    if (status[s.status] != null) status[s.status]++;
    missN += I.missing.length; missSum += I.missingCost;
    if (I.owned) pubs[s.publisher || 'Ohne Verlag'] = (pubs[s.publisher || 'Ohne Verlag'] || 0) + I.owned;
    for (const v of Object.values(s.volumes)) {
      if (v.owned) {
        const p = listPrice(s, v); if (p != null) { priced++; priceSum += p; }
        if (v.bought) { const mo = months.find(x => v.bought.startsWith(x.p)); const sp = spentPrice(s, v) || 0; if (mo) { mo.n++; mo.sum += sp; } if (v.bought.startsWith(year)) { yearN++; yearSum += sp; } }
      } else if (v.date && s.follow !== false) { const mo = up.find(x => v.date.startsWith(x.p)); if (mo && !isOut(v.date) || (mo && v.date.length === 7)) { mo.n++; mo.sum += listPrice(s, v) || 0; } }
    }
    if (I.denom) prog.push({ s, I });
    if (I.unread) sub.push({ s, n: I.unread });
  }
  const meters = vols * thick / 100;
  const maxM = Math.max(1, ...months.map(x => x.n)), maxU = Math.max(1, ...up.map(x => x.sum));
  const pubRows = Object.entries(pubs).sort((a, b) => b[1] - a[1]).slice(0, 8), maxP = Math.max(1, ...pubRows.map(x => x[1]));
  prog.sort((a, b) => b.I.pct - a.I.pct || b.I.owned - a.I.owned);
  sub.sort((a, b) => b.n - a.n);
  const hrow = (name, w, val, ok, act) => `<div class="hrow"${act || ''}><span class="nm">${esc(name)}</span><span class="track"><i class="${ok ? 'ok' : ''}" style="width:${Math.max(2, Math.round(w * 100))}%"></i></span><b>${val}</b></div>`;
  return `
  <h2 style="font:30px/1.1 var(--fd);margin:12px 0 4px;text-wrap:balance">${plural(vols, 'Band', 'Bände')} · ${money(value)}</h2>
  <p class="muted" style="margin:0">${plural(list.length, 'Reihe', 'Reihen')}, davon ${complete} komplett · ${meters.toLocaleString('de-DE', { maximumFractionDigits: 1 })} m Regal</p>
  <div class="tiles">
    <div class="tile dark"><b>${yearN}</b><span>Käufe ${year}</span><small>${money(yearSum)} ausgegeben</small></div>
    <div class="tile"><b>${unread}</b><span>Lesestapel</span><small>${vols ? Math.round((vols - unread) / vols * 100) : 0} % gelesen</small></div>
    <div class="tile"><b>${priced ? money(priceSum / priced) : '–'}</b><span>Ø Preis pro Band</span><small>Listenpreis</small></div>
    <div class="tile"><b>${missN}</b><span>Lücken</span><small>${money(missSum)} zum Auffüllen</small></div>
    <div class="tile"><b>${status.laufend}</b><span>Laufende Reihen</span><small>${status.abgeschlossen} abgeschlossen · ${status.pausiert} pausiert</small></div>
    <div class="tile"><b>${meters.toLocaleString('de-DE', { maximumFractionDigits: 2 })} m</b><span>Regalbreite</span><small>bei ${thick.toLocaleString('de-DE')} cm pro Band</small></div>
  </div>
  <div class="statgrid">
    <div class="card2"><h3>Käufe pro Monat</h3><div class="small muted">Bände mit Kaufdatum, letzte 12 Monate</div>
      <div class="bars">${months.map((x, i) => `<div><u>${x.n || ''}</u><i class="${i === 11 ? 'hot' : ''}" style="height:${Math.round(x.n / maxM * 100)}%"></i><em>${x.l}</em></div>`).join('')}</div></div>
    <div class="card2"><h3>Kommende Ausgaben</h3><div class="small muted">Angekündigte Bände deiner Reihen</div>
      <div class="bars" style="--n:6">${up.map((x, i) => `<div><u>${x.sum ? Math.round(x.sum) + ' €' : ''}</u><i class="${i === 0 ? 'hot' : ''}" style="height:${Math.round(x.sum / maxU * 100)}%"></i><em>${x.l}</em></div>`).join('')}</div></div>
    <div class="card2"><h3>Verlage</h3>${pubRows.map(([p, n]) => hrow(p, n / maxP, n)).join('') || '<p class="muted">–</p>'}</div>
    <div class="card2"><h3>Fortschritt</h3>${prog.slice(0, 10).map(({ s, I }) => hrow(s.title, I.pct, `${I.owned}/${I.denom}`, I.complete, ` data-a="openSeries" data-id="${esc(s.id)}" role="button" tabindex="0" style="cursor:pointer"`)).join('')}</div>
    ${sub.length ? `<div class="card2"><h3>Lesestapel</h3>${sub.slice(0, 8).map(x => hrow(x.s.title, x.n / sub[0].n, x.n, false, ` data-a="openSeries" data-id="${esc(x.s.id)}" role="button" tabindex="0" style="cursor:pointer"`)).join('')}</div>` : ''}
  </div>`;
}

function dateSel(id, val) {
  const [y, m, d] = String(val || '').split('-'), cy = new Date().getFullYear();
  const ys = []; for (let i = cy - 4; i <= cy + 3; i++) ys.push(i); if (y && !ys.includes(+y)) { ys.push(+y); ys.sort((a, b) => a - b); }
  const opt = (v, l, sel) => `<option value="${v}"${sel ? ' selected' : ''}>${l}</option>`;
  return `<div class="dsel" data-dsel="${id}">
    <select class="in" id="${id}-d" data-keep="no" aria-label="Tag">${opt('', 'Tag ?', !d)}${[...Array(31)].map((_, i) => opt(pad(i + 1), (i + 1) + '.', d && +d === i + 1)).join('')}</select>
    <select class="in" id="${id}-m" data-keep="no" aria-label="Monat">${opt('', 'Monat', !m)}${MONL.map((n, i) => opt(pad(i + 1), n, m && +m === i + 1)).join('')}</select>
    <select class="in" id="${id}-y" data-keep="no" aria-label="Jahr">${opt('', 'Jahr', !y)}${ys.map(n => opt(n, n, y && +y === n)).join('')}</select></div>`;
}
function readDateSel(root, id) {
  const g = x => root.querySelector(`#${id}-${x}`)?.value || '';
  const d = g('d'), m = g('m'), y = g('y');
  if (!d && !m && !y) return null;
  if (!m || !y) return undefined;
  if (!d) return `${y}-${m}`;
  return `${y}-${m}-${pad(Math.min(+d, new Date(+y, +m, 0).getDate()))}`;
}

const mpIdFrom = q => { const m = String(q).match(/manga-passion\.de\/editions\/(\d+)/); return m ? +m[1] : null; };
let searchT = 0, searchN = 0;
async function runSearch(q) {
  const box = $('#aRes'); if (!box) return;
  q = q.trim();
  const id = mpIdFrom(q); if (id != null) { pickEdition(id); return; }
  if (q.length < 2) { box.innerHTML = `<p class="small muted">Mindestens zwei Buchstaben.</p>`; return; }
  const my = ++searchN;
  box.innerHTML = `<p class="small muted">Suche „${esc(q)}“ bei Manga Passion …</p>`;
  try {
    let res = await MP.search(q);
    if (!res.length && cleanQ(q) !== q) res = await MP.search(cleanQ(q));
    if (my !== searchN) return;
    res.sort((a, b) => (b.print - a.print) || (similar(b.title, q) - similar(a.title, q)) || ((b.total || 0) - (a.total || 0)));
    res = res.slice(0, 30);
    box.innerHTML = res.length ? res.map(e => `<button class="res" data-a="pickEd" data-id="${esc(e.mp)}"><div class="cv" style="--c:var(--bg2)">${e.cover ? `<img src="${esc(e.cover)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ''}</div><div><b>${esc(e.title)}</b><span>${esc([e.publisher, STATUS[MPST[e.stat]] || '', e.total ? plural(e.total, 'Band', 'Bände') : '', e.print ? '' : 'nur digital'].filter(Boolean).join(' · '))}</span></div>${icon('right')}</button>`).join('')
      : `<p class="muted">Keine Treffer bei Manga Passion. Prüfe die Schreibweise oder leg die Reihe selbst an.</p>`;
  } catch (e) {
    if (my !== searchN) return;
    box.innerHTML = `<div class="card2"><b>Manga Passion nicht erreichbar</b><p class="small muted" style="margin:4px 0 10px">${esc(netErr(e))}. Unter Einstellungen kannst du die Verbindung testen.</p><button class="btn sm dark" data-a="manualSeries" data-v="${esc(q)}">„${esc(q)}“ selbst anlegen</button></div>`;
  }
}
async function pickEdition(edId) {
  const sh = sheets[sheets.length - 1], box = $('#aRes');
  if (sh?.data.link) {
    const s = D().series[sh.data.link]; if (!s) return;
    if (box) box.innerHTML = `<p class="small muted">Lade Reihe von Manga Passion …</p>`;
    const before = JSON.stringify(s);
    try {
      const r = await mpImport(s, edId);
      closeSheet(); commit(); Covers.series(s.id);
      toast(`Verknüpft: ${plural(r.count, 'Band', 'Bände')}${r.upcoming ? `, ${r.upcoming} angekündigt` : ''}`, () => { D().series[s.id] = JSON.parse(before); D().series[s.id].updated = Date.now(); commit(); });
    } catch (e) { if (box) box.innerHTML = `<p class="red">Konnte die Reihe nicht laden (${esc(netErr(e))}).</p>`; }
    return;
  }
  const existing = seriesList().find(s => s.mp != null && String(s.mp) === String(edId));
  if (existing) { closeSheet(); openSeries(existing.id); toast('Diese Reihe ist schon in deinem Regal'); return; }

  box.innerHTML = `<p class="small muted">Lade Reihe von Manga Passion …</p>`;

  catch (e) { box.innerHTML = `<p class="red">Konnte die Reihe nicht laden (${esc(netErr(e))}).</p>`; return; }
  if (sh) sh.data.draft = draft;
  const I = info(draft), out = I.maxRel, [c, fg] = col(draft), cov = scov(draft) || ed?.cover || '';

const Scan = {
  stream: null, timer: 0, busy: false, paused: false, last: { code: '', t: 0 }, pending: { code: '', t: 0 }, log: [], ac: null, torch: false,
  async open() {
    const sc = $('#scanner');
    sc.hidden = false; document.body.classList.add('noscroll', 'scan-open');
    this.log = []; $('#scanLog').innerHTML = ''; this.card(null); this.msg('Kamera wird gestartet …');
    $('#contBtn').classList.toggle('on', !!LOC.cont); $('#contBtn').setAttribute('aria-pressed', !!LOC.cont);
    try { this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)(); this.ac.resume?.(); } catch {}
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) { this.noCam('Live-Kamera braucht eine https-Adresse. Fotografiere den Barcode oder tippe die ISBN.'); return; }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    } catch (e) { this.noCam(e.name === 'NotAllowedError' ? 'Kamerazugriff verweigert. Erlaube die Kamera in den Einstellungen – oder nutze Foto bzw. ISBN.' : 'Keine Kamera verfügbar. Fotografiere den Barcode oder tippe die ISBN.'); return; }
    if ($('#scanner').hidden) { this.stopCam(); return; }
    const vid = $('#cam'); vid.srcObject = this.stream;
    try { await vid.play(); } catch {}
    sc.classList.remove('nocam');
    const track = this.stream.getVideoTracks()[0];
    try { const caps = track.getCapabilities?.() || {}; $('#torchBtn').hidden = !caps.torch; $('#torchSpacer').hidden = !!caps.torch; if (caps.focusMode?.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch {}
    this.msg('Barcode auf der Rückseite in den Rahmen halten');
    this.paused = false; this.loop();
  },
  noCam(text) { $('#scanner').classList.add('nocam'); this.msg(text); },
  msg(t) { $('#scanMsg').textContent = t; },
  card(html) { const c = $('#scanCard'); c.hidden = !html; c.innerHTML = html || ''; $('#scanMsg').hidden = !!html; if (html) c.scrollTop = 0; },
  loop() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      if ($('#scanner').hidden || !this.stream) return;
      if (!this.paused && !this.busy && document.visibilityState === 'visible') this.tick();
      this.loop();
    }, 110);
  },
  tick() {
    const vid = $('#cam'), vw = vid.videoWidth, vh = vid.videoHeight;
    if (!vw || !vh) return;
    const portrait = vh > vw;
    const cw = Math.round(vw * (portrait ? 0.92 : 0.7)), ch = Math.round(Math.min(vh * (portrait ? 0.34 : 0.5), cw * 0.62));
    const sx = (vw - cw) >> 1, sy = Math.round((vh - ch) * (portrait ? 0.42 : 0.45));
    const sc = Math.min(1, 1280 / cw), W = Math.round(cw * sc), H = Math.round(ch * sc);
    const cv = $('#cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
    cv.width = W; cv.height = H;
    ctx.drawImage(vid, sx, sy, cw, ch, 0, 0, W, H);
    const r = EAN13.decode(EAN13.gray(ctx.getImageData(0, 0, W, H)), W, H, { angles: [0, 6, 174, 12, 168, 90], enough: 2, step: Math.max(4, Math.round(H / 40)) });
    if (!r || !/^97[89]/.test(r.code)) return;
    const now = Date.now();
    if (r.votes < 2 && !(this.pending.code === r.code && now - this.pending.t < 1500)) { this.pending = { code: r.code, t: now }; return; }
    if (this.last.code === r.code && now - this.last.t < 3500) return;
    this.last = { code: r.code, t: now };
    this.hit(r.code);
  },
  beep(ok = true) {
    try { const ac = this.ac; if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = ok ? 1320 : 440; g.gain.value = 0.12; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + (ok ? 0.09 : 0.22)); } catch {}
    try { navigator.vibrate?.(ok ? 40 : [60, 40, 60]); } catch {}
  },
  hit(code) {
    const aim = $('#aim'); aim.classList.add('hit'); setTimeout(() => aim.classList.remove('hit'), 500);
    this.beep(true);
    handleCode(code, !!LOC.cont);
  },
  addLog(text, cls) { this.log.unshift({ text, cls }); $('#scanLog').innerHTML = this.log.slice(0, 20).map(l => `<span class="${l.cls || ''}">${esc(l.text)}</span>`).join(''); },
  stopCam() { clearTimeout(this.timer); if (this.stream) for (const t of this.stream.getTracks()) t.stop(); this.stream = null; $('#cam').srcObject = null; },

async function decodeFile(file) {
  let img;

  catch { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }

    try { const bd = new window.BarcodeDetector({ formats: ['ean_13'] }); const res = await bd.detect(img); const hit = res.find(x => /^97[89]\d{10}$/.test(x.rawValue)); if (hit) return hit.rawValue; } catch {}
  }

  for (const max of [1600, 2600, 1000]) {
    const sc = Math.min(1, max / Math.max(w, h)), W = Math.round(w * sc), H = Math.round(h * sc);
    cv.width = W; cv.height = H; ctx.drawImage(img, 0, 0, W, H);
    await sleep(10);
    const r = EAN13.decode(EAN13.gray(ctx.getImageData(0, 0, W, H)), W, H);
    if (r && /^97[89]/.test(r.code)) return r.code;
    if (sc === 1 && max >= 1600) break;
  }
  return null;
}

      <label class="toggle">Schon im Regal<input type="checkbox" id="nv-o"></label>
      <div class="row" style="margin-top:14px"><button class="btn pri" data-a="saveNewVol" data-id="${esc(s.id)}">Hinzufügen</button></div>`, { live: false });
  },
  saveNewVol(b) {
    const n = nk($('#nv-n').value); if (!n || n === 'null') { toast('Bandnummer fehlt'); return; }
    const isbn = $('#nv-i').value.trim() ? normIsbn($('#nv-i').value) : null;
    if ($('#nv-i').value.trim() && !isbn) { toast('ISBN ungültig'); return; }
    const p = num($('#nv-p').value), d = readDateSel(document, 'nv-d'), o = $('#nv-o').checked;
    if (d === undefined) { toast('Bitte Monat und Jahr auswählen'); return; }
    closeSheet();
    change(b.dataset.id, s => { setVol(s, n, { price: p ?? undefined, date: d || undefined, isbn: isbn || undefined }); if (o) own(s, n); if (!d && !o && num(n) > (num(s.released) || 0)) s.released = num(n); }, `Band ${n} hinzugefügt`);
  },
  openVol(b) { openVol(b.dataset.id, b.dataset.n); },
  range(b) {
    const id = b.dataset.id, inp = $('#rng-' + CSS.escape(id)), ks = parseRanges(inp?.value);
    if (!ks.length) { toast('Bände eingeben, z. B. 1-12, 14'); inp?.focus(); return; }
    const op = b.dataset.op, sh = sheets.find(x => x.el === b.closest('.sheet-wrap'));
    if (sh) sh.data.bulk = true;
    change(id, s => { for (const k of ks) { if (op === 'own') own(s, k); else if (op === 'read') { const v = s.volumes[k]; if (v && v.owned) setVol(s, k, { read: true }); else { own(s, k); setVol(s, k, { read: true }); } } else if (op === 'unown') own(s, k, false); } }, `${plural(ks.length, 'Band', 'Bände')} ${op === 'own' ? 'ins Regal gestellt' : op === 'read' ? 'als gelesen markiert' : 'aus dem Regal genommen'}`);
    const ni = $('#rng-' + CSS.escape(id)); if (ni) ni.value = '';
  },
  vfilt(b) {
    const sh = sheets.find(x => x.el === b.closest('.sheet-wrap')); if (!sh) return;
    const v = b.dataset.v; sh.data.vf = sh.data.vf === v && v !== 'all' ? 'all' : v;
    refreshSheets();
    if (!b.closest('.vfil')) sh.el.querySelector('.vfil')?.scrollIntoView({ block: 'start', behavior: 'smooth' });
  },
  rate(b) { const v = +b.dataset.v; change(b.dataset.id, s => { s.rating = s.rating === v ? 0 : v; }); },
  async delVol(b) {
    const { id, n } = b.dataset;
    closeSheet();
    change(id, s => { delete s.volumes[n]; (s.vdel ||= {})[n] = Date.now(); if (num(s.released) === num(n)) s.released = num(n) - 1; }, `Band ${n} entfernt`);
  },
  filter(b) { LOC.filter = b.dataset.v; saveLocal(); render(); },
  mode(b) { LOC.mode = b.dataset.v; saveLocal(); render(); },
  month(b) { const d = new Date(TM.y, TM.m + +b.dataset.v, 1); TM = { y: d.getFullYear(), m: d.getMonth() }; render(); },
  gotoMonth(b) { TM = { y: +b.dataset.y, m: +b.dataset.m }; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); },
  calDay(b) { $('#day-' + b.dataset.v)?.scrollIntoView({ behavior: 'smooth', block: 'center' }); },
  togglePre(b) { change(b.dataset.id, s => { const v = s.volumes[b.dataset.n]; setVol(s, b.dataset.n, { pre: v?.pre ? null : true }); }); },
  buyVol(b) { const s = D().series[b.dataset.id]; change(b.dataset.id, x => own(x, b.dataset.n), `${s.title} ${b.dataset.n} gekauft`); },
  refreshAll() { refreshAll(false); },
  inboxAssign(b) { const it = D().inbox[b.dataset.isbn]; if (!it) return; const g = Object.assign({ isbn: it.isbn }, it.guess || {}); if (!g.sid && g.title) g.sid = matchSeries(g.title)?.id || null; openSheet(() => `<h2>Band zuordnen</h2><div class="scan-card" style="box-shadow:none;padding:0;max-height:none">${assignForm(it.isbn, g, 'sheet')}</div>`, { live: false }); },
  inboxDel(b) { const st = D(), it = st.inbox[b.dataset.isbn]; if (!it) return; delete st.inbox[b.dataset.isbn]; st.deleted['inbox:' + b.dataset.isbn] = Date.now(); commit(); toast('Aus dem Eingang entfernt', () => { st.inbox[it.isbn] = Object.assign(it, { t: Date.now() }); delete st.deleted['inbox:' + it.isbn]; commit(); }); },
  async copyList() {
    const lines = [`Manga-Einkaufsliste (${new Date().toLocaleDateString('de-DE')})`]; let sum = 0;
    for (const s of seriesList().sort((a, b) => a.title.localeCompare(b.title, 'de'))) { const I = info(s); if (!I.missing.length) continue; sum += I.missingCost; lines.push(`• ${s.title}${s.publisher ? ` (${s.publisher})` : ''}: Bd. ${I.missing.join(', ')} – ${money(I.missingCost)}`); }
    lines.push(`Summe: ${money(sum)}`);
    try { await navigator.clipboard.writeText(lines.join('\n')); toast('Liste kopiert'); } catch { openSheet(() => `<h2>Einkaufsliste</h2><textarea class="in" rows="10" readonly>${esc(lines.join('\n'))}</textarea>`, { live: false }); }
  },
  settings() { openSheet(settingsSheet, { live: false }); },
  theme(b) { LOC.theme = b.dataset.v; saveLocal(); applyTheme(); for (const x of $$('[data-a=theme]')) x.classList.toggle('on', x.dataset.v === LOC.theme); },
  saveSettings() {
    const st = D().settings;
    st.budget = num($('#s-budget').value) || 0; st.thick = num($('#s-thick').value) || 1.6; st.updated = Date.now();
    saveLocal(); commit(); toast('Gespeichert');
  },
  async mpTest() {
    const out = $('#mpOut'), raw = $('#mpRaw'); out.textContent = 'Teste Verbindung zu Manga Passion …'; raw.hidden = true;
    const t0 = performance.now();
    try {
      const res = await MP.search('Frieren');
      const f = res.find(e => /frieren/i.test(e.title) && e.total > 1) || res[0];
      let extra = '';
      if (f) {
        const rawV = await MP.volumesRaw(f.mp, true), reg = mpRegular(rawV), nx = reg.find(v => v.date && !isOut(v.date));
        extra = ` · ${plural(reg.length, 'Band', 'Bände')}${nx ? ` · Band ${nx.number} erscheint ${fmtDate(nx.date)}` : ''}`;
        if (rawV[0]) { const d = await MP.volume(rawV[0].id); extra += d.isbn ? ` · ISBN-Abfrage ok` : ''; }
      }
      out.innerHTML = f ? `<b class="nowrap" style="color:var(--ok)">Verbindung ok</b> · „${esc(f.title)}“${esc(extra)} · ${Math.round(performance.now() - t0)} ms` : `<b class="red">Verbunden, aber keine Treffer.</b> Kopier die Rohdaten und schick sie Claude.`;
      raw.textContent = MP.raw.slice(0, 4000); raw.hidden = false;
      if (!$('#copyRawBtn')) raw.insertAdjacentHTML('afterend', `<button class="btn sm" data-a="copyRaw" id="copyRawBtn">${icon('copy')}Rohdaten kopieren</button>`);
    } catch (e) { out.innerHTML = `<b class="red">Fehler:</b> ${esc(netErr(e))}${e instanceof TypeError && navigator.onLine !== false ? '<br>Wahrscheinlich lässt Manga Passion Abfragen aus dem Browser nicht zu. Unter „Erweitert: Proxy“ kannst du einen Umweg eintragen.' : ''}`; }
  },
  async copyRaw() { try { await navigator.clipboard.writeText(MP.raw.slice(0, 30000)); toast('Rohdaten kopiert'); } catch { toast('Kopieren nicht möglich'); } },
  saveProxy() {
    const v = $('#s-proxy').value.trim();
    if (v && !/^https:\/\//.test(v)) { toast('Der Proxy muss mit https:// beginnen'); return; }
    LOC.proxy = v; saveLocal(); MP.cache.clear(); toast(v ? 'Proxy gespeichert – jetzt testen' : 'Proxy entfernt');
  },
  syncSave() {
    const t = $('#gh-token').value.trim(); if (!t) { toast('Token fehlt'); return; }
    LOC.gh = Object.assign(LOC.gh || {}, { token: t }); saveLocal(); Sync.run().then(() => { const sh = sheets[sheets.length - 1]; if (sh && sh.render === settingsSheet) sh.el.querySelector('.sb').innerHTML = settingsSheet(); });
  },
  async syncOff() { if (!await ask('Sync auf diesem Gerät ausschalten? Deine Daten bleiben hier und im Gist erhalten.', 'Ausschalten')) return; LOC.gh = {}; saveLocal(); closeAllSheets(); toast('Sync ausgeschaltet'); },
  async export() {
    const txt = JSON.stringify(exportData(S), null, 1), name = `manga-regal-${todayISO()}.json`;
    await shareOrDownload(new File([txt], name, { type: 'application/json' }));
  },
  async csv() {
    const rows = [['Reihe', 'Band', 'Im Regal', 'Gelesen', 'Vorbestellt', 'Preis', 'Bezahlt', 'Erscheinung', 'Gekauft', 'ISBN', 'Verlag', 'Status']];
    for (const s of seriesList().sort((a, b) => a.title.localeCompare(b.title, 'de'))) for (const k of Object.keys(s.volumes).sort(byNum)) { const v = s.volumes[k]; rows.push([s.title, k, v.owned ? 'ja' : '', v.read ? 'ja' : '', v.pre ? 'ja' : '', listPrice(s, v) ?? '', v.paid ?? '', v.date || '', v.bought || '', v.isbn || '', s.publisher || '', STATUS[s.status] || '']); }
    const txt = '﻿' + rows.map(r => r.map(c => { const x = String(c).replace('.', typeof c === 'number' ? ',' : '.'); return /[;"\n]/.test(x) ? `"${x.replace(/"/g, '""')}"` : x; }).join(';')).join('\n');
    await shareOrDownload(new File([txt], `manga-regal-${todayISO()}.csv`, { type: 'text/csv' }));
  },
  import() { const f = $('#importIn'); f.value = ''; f.click(); },
  async wipe() { if (!await ask('Wirklich alle Reihen, Bände und Einstellungen auf diesem Gerät löschen? Mach vorher ein Backup.', 'Alles löschen', { danger: true })) return; const old = S; S = blank(); for (const id of Object.keys(old.series)) S.deleted[id] = Date.now(); persist(); closeAllSheets(); render(); badges(); toast('Alle Daten gelöscht'); },
  demo() { DEMO = demoState(); closeAllSheets(); location.hash = '#regal'; render(); badges(); toast('Demo-Modus: probier alles aus'); },
  endDemo() { DEMO = null; closeAllSheets(); render(); badges(); },
  closeSheet() { closeSheet(); },
  dlg(b) { const sh = sheets[sheets.length - 1]; sh?.data.resolve?.(b.dataset.v); },
};
async function shareOrDownload(file) {
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: file.name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}
function applyTheme() {
  const dark = LOC.theme === 'dark' || (LOC.theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  $('meta[name=theme-color]').content = dark ? '#111014' : '#ffffff';
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]');
  if (!el) return;
  const a = el.dataset.a;
  if (A[a]) { e.preventDefault(); A[a](el, e); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (sheets.length) closeSheet(); else if (!$('#scanner').hidden) Scan.close(); }
  if (e.key === 'Enter') {
    const t = e.target;
    if (t.id === 'isbnIn') A.isbnGo();
    if (t.id === 'aq') { clearTimeout(searchT); runSearch(t.value); t.blur(); }
    if (t.matches?.('[data-a][role=button]')) A[t.dataset.a]?.(t);
  }
});
document.addEventListener('input', e => {
  const t = e.target;
  if (t.id === 'rq') { LOC.q = t.value; saveLocal(); renderShelf(); }
  if (t.id === 'aq') { clearTimeout(searchT); searchT = setTimeout(() => runSearch(t.value), 450); }
});
document.addEventListener('change', e => {
  const t = e.target;
  if (t.id === 'rsort') { LOC.sort = t.value; saveLocal(); renderShelf(); }
  if (t.id === 'as-s') { const w = t.closest('.scan-card, .sheet').querySelector('#as-newwrap'); if (w) w.hidden = !!t.value; }
  const ds = t.closest?.('[data-dsel]');
  if (ds) {
    const did = ds.dataset.dsel, yEl = ds.querySelector(`#${did}-y`), mEl = ds.querySelector(`#${did}-m`);
    if (t === mEl && mEl.value && !yEl.value) { const now = new Date(); yEl.value = String(+mEl.value >= now.getMonth() + 1 ? now.getFullYear() : now.getFullYear() + 1); }
    if (did === 'vf-date') {
      const val = readDateSel(ds, did); if (val === undefined) return;
      const sh = sheets.find(x => x.el === ds.closest('.sheet-wrap')); if (!sh) return;
      change(sh.data.id, s => setVol(s, sh.data.k, { date: val, ds: val ? 'user' : null, tba: null }));
    }
    return;
  }
  if (t.dataset.vf) {
    const sh = sheets[sheets.length - 1]; if (!sh) return;
    const { id, k } = sh.data, f = t.dataset.vf;
    let val = t.type === 'checkbox' ? (t.checked || null) : t.value.trim();
    if (f === 'price' || f === 'paid') val = num(val);
    if (f === 'isbn' && val) { const x = normIsbn(val); if (!x) { toast('ISBN ungültig'); return; } val = x; }
    if (f === 'ed' && val === 'Standard') val = null;
    change(id, s => {
      if (f === 'owned') own(s, k, !!val);
      else if (f === 'read' && val) { if (!s.volumes[k]?.owned) own(s, k); setVol(s, k, { read: true }); }
      else setVol(s, k, { [f]: val });
    });
    if (f === 'owned' || f === 'read') for (const x of $$('[data-vf]', sh.el)) if (x.type === 'checkbox') x.checked = !!D().series[id]?.volumes[k]?.[x.dataset.vf];
  }
});
$('#photoIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  Scan.paused = true; Scan.card(null); Scan.msg('Lese Barcode aus dem Foto …');
  try {
    const code = await decodeFile(f);
    if (code) { Scan.beep(true); Scan.msg('Barcode erkannt'); handleCode(code, false); }
    else { Scan.beep(false); Scan.msg('Kein Barcode erkannt. Näher ran, scharf stellen, gerade halten – oder die ISBN tippen.'); Scan.paused = false; }
  } catch { Scan.msg('Foto konnte nicht gelesen werden.'); Scan.paused = false; }
});
$('#coverIn').addEventListener('change', async e => {
  const f = e.target.files[0], t = coverTarget; coverTarget = null;
  if (!f || !t) return;
  try {
    const url = await fileToCover(f);
    change(t.id, s => { if (t.k == null) s.cover = url; else setVol(s, t.k, { cover: url, cvx: null }); }, 'Cover gespeichert');
  } catch { toast('Bild konnte nicht gelesen werden'); }
});
$('#importIn').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const data = JSON.parse(await f.text());
    if (!data || typeof data.series !== 'object') throw new Error('Kein Manga-Regal-Backup');
    const n = Object.keys(data.series).length;
    const how = await ask(`Das Backup enthält ${plural(n, 'Reihe', 'Reihen')}.`, '', { title: 'Backup laden', buttons: [['Zusammenführen', 'merge', 'dark'], ['Ersetzen', 'replace', ''], ['Abbrechen', '', 'ghost']] });
    if (!how) return;
    S = how === 'replace' ? fixState(data) : mergeStates(S, fixState(data));
    if (how === 'replace') for (const s of Object.values(S.series)) s.updated = Date.now();
    DEMO = null; persist(); closeAllSheets(); render(); badges(); toast('Backup geladen');
  } catch (err) { toast('Import fehlgeschlagen: ' + err.message); }
});
document.addEventListener('error', e => { if (e.target.tagName === 'IMG') e.target.classList.add('broken'); }, true);
window.addEventListener('hashchange', () => { closeAllSheets(); render(); window.scrollTo(0, 0); if (view() === 'termine') autoRefresh(); });
window.addEventListener('scroll', () => $('#top').classList.toggle('scrolled', scrollY > 4), { passive: true });
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change', applyTheme);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') { Sync.schedule(300); badges(); } });
let lastW = 0;
new ResizeObserver(() => { const w = $('#main').clientWidth; if (Math.abs(w - lastW) > 30) { lastW = w; if (view() === 'regal') renderShelf(); } }).observe($('#main'));
window.addEventListener('storage', e => { if (e.key === KEY && !DEMO) { S = load(); render(); refreshSheets(); badges(); } });
function autoRefresh(force) { if (DEMO || !navigator.onLine || !seriesList().length) return; if (force || Date.now() - (LOC.lastRefresh || 0) > 20 * 3600e3) refreshAll(true); }

applyTheme(); render(); badges();
setTimeout(() => Covers.all(), 1500);
if (view() === 'termine') autoRefresh();
else if (seriesList().some(s => s.mp == null && s.dnb)) setTimeout(() => autoRefresh(true), 2500);
Sync.schedule(600);
window.MangaRegal = { get state() { return D(); }, MP, mpRegular, mpVol, mpFindIsbn, lookupIsbn, EAN13, mergeStates, info, parseRanges, parseSeriesTitle, normIsbn };
}
