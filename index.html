<style>
/* VOICE: a collector's app — crisp, quick, a little manga.
   IDEA: the shelf itself: coloured tankōbon spines on black boards, gaps you can see.
   PICTURE: the shelf (spines per series) and real German covers per volume.
   COLOUR & TYPE: paper white + ink + hanko red; Dela Gothic One titles, Zen Kaku Gothic body.
   LAYOUT: app shell — sticky header, views, bottom tab bar with a red scan button. */
:root{
  --bg:#ffffff;--bg2:#f4f3f1;--card:#ffffff;--ink:#141317;--ink2:#55525b;--ink3:#8b8892;--line:#e6e4e1;
  --red:#e5322d;--red2:#fde8e6;--ok:#13814a;--ok2:#e2f3e9;--board:#141317;
  --rd:#6a45d9;--rd2:#efeafd;--dg:#0e8aa0;--dg2:#e0f3f6;--dgf:#ffffff;
  --shadow:0 1px 2px rgba(0,0,0,.06),0 10px 28px -14px rgba(0,0,0,.28);
  --r:14px;
  --fd:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --ft:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#111014;--bg2:#1c1b20;--card:#1b1a1f;--ink:#f4f2ef;--ink2:#bdb9c3;--ink3:#8c8893;--line:#2f2d34;
  --red:#ff4d40;--red2:#3b1714;--ok:#3ccf7d;--ok2:#11301f;--board:#55525c;
  --rd:#a48cff;--rd2:#251d3f;--dg:#3fcde0;--dg2:#0d2a30;--dgf:#062a30;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 12px 30px -14px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:90px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--ft);overflow-x:clip;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
img.broken{display:none}
.ic{width:22px;height:22px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.muted{color:var(--ink3)}.small{font-size:13.5px}.red{color:var(--red)}
.nowrap{white-space:nowrap}
[hidden]{display:none!important}

/* header & tabs */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:calc(env(safe-area-inset-top) + 10px) max(14px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));
  background:var(--bg);border-bottom:1px solid transparent;transition:border-color .2s}
.top.scrolled{border-bottom-color:var(--line)}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none}
.hanko{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;background:var(--red);color:#fff;font:19px/1 var(--fd);transform:rotate(-5deg)}
.brand h1{margin:0;font:clamp(18px,5.6vw,22px)/1 var(--fd);white-space:nowrap}
.tools{display:flex;gap:2px}
.iconbtn{width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;color:var(--ink)}
.iconbtn:active{background:var(--bg2)}
main{max-width:1180px;margin:0 auto;padding:4px max(16px,env(safe-area-inset-right)) calc(118px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,minmax(0,120px));justify-content:center;align-items:end;
  padding:6px max(8px,env(safe-area-inset-right)) calc(4px + env(safe-area-inset-bottom)) max(8px,env(safe-area-inset-left));
  background:var(--card);border-top:1px solid var(--line)}

.bchips .chip{min-height:32px;font-size:13px;padding:0 12px}
.sx-buy{margin-top:10px;font-size:15px}
.wishbtn .badge{position:absolute;top:2px;right:0}
.btn.heart{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.heart .ic{color:var(--red)}
.btn.heart.on{background:var(--red2);border-color:var(--red2);color:var(--red)}
.btn.heart.on .ic,.wl-heart .ic,.nw-wish .ic,.wishtag .ic,.legend .ic{fill:currentColor}
.sx-cta{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;margin-top:14px}
.btn.heart.iconly{width:52px;padding:0}
.btn.heart.iconly .ic{width:24px;height:24px}
.sx-cta .btn{width:100%;justify-content:center}
.sx-about{margin-top:16px}
.vdesc.clamp{display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.linkbtn{border:0;background:none;padding:6px 0 0;color:var(--blue,#2b59c3);font:inherit;font-weight:700;cursor:pointer}
.sx-end{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px;padding-top:16px;border-top:1px solid var(--line)}
.sx-end .btn{display:inline-flex;align-items:center;gap:8px}
.sx-end .btn .ic{color:var(--red)}
.wishtag{gap:5px}.wishtag .ic{width:14px;height:14px;color:#ff8a8a}
.vc.rem .cv{box-shadow:0 1px 2px rgba(0,0,0,.18),0 8px 14px -8px rgba(0,0,0,.4)}
.vc.rem small{color:var(--ink2)}
.vc.rem.up small{color:var(--red)}
.vc.rem.up .cv{opacity:.9}
.wl .sc{position:relative}
.wl-heart{position:absolute;top:12px;right:12px;color:var(--red)}
.wl-heart .ic{width:20px;height:20px}
.or{text-align:center;color:var(--ink3);font-size:13px;margin:14px 0 8px}
.vg-act2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.vg-act2 .btn{width:100%;justify-content:center}
.nw.mine .cv{outline:3px solid var(--red);outline-offset:3px}
.nw-wish{position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;color:var(--red);z-index:2;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.nw-wish .ic{width:15px;height:15px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin:8px 0 0;font-size:12.5px;color:var(--ink2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend .ic{width:15px;height:15px;color:var(--red)}
.lg-mine{display:inline-block;width:12px;height:16px;border-radius:2px;outline:2.5px solid var(--red);outline-offset:1.5px;background:var(--bg2)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.swatches label{position:relative}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:9px;background:var(--c);box-shadow:inset 0 0 0 1px rgba(0,0,0,.15)}
.swatches input:checked+span{box-shadow:0 0 0 3px var(--bg),0 0 0 5px var(--ink)}
.res{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit}
.res .cv{border-radius:3px;width:48px}
.res b{display:block;line-height:1.25}
.res span{font-size:13px;color:var(--ink3)}
.dialog .sheet{max-width:440px}
.raw{font:12px/1.45 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow:auto;background:var(--bg2);border-radius:10px;padding:10px;margin:8px 0}

/* calendar */
.monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0 12px}
.monthnav h2{font:28px/1.1 var(--fd);margin:0;text-align:center;flex:1}
.budget{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:6px 16px;padding:16px;border-radius:var(--r);background:var(--ink);color:var(--bg)}
.budget .big{font:34px/1 var(--fd)}
.budget span{font-weight:700;opacity:.75;font-size:14px}
.meter{flex-basis:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.2);overflow:hidden}
.meter i{display:block;height:100%;background:#fff;border-radius:4px}
.meter.over i{background:var(--red)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;margin:14px 0 6px}
.cal .dow{font-size:11.5px;font-weight:700;color:var(--ink3);text-align:center;padding-bottom:2px}
.cal .d{position:relative;height:clamp(40px,10vw,60px);border-radius:10px;display:grid;place-items:center;font-weight:700;font-size:14px;border:0;background:transparent;color:var(--ink2);padding:0}
.cal .d.has{background:var(--red);color:#fff}
.cal .d.own{background:var(--ink);color:var(--bg)}
.cal .d.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .d.today.has{box-shadow:inset 0 0 0 2px var(--ink),inset 0 0 0 4px #fff}
.cal .d em{position:absolute;top:2px;right:5px;font-size:10px;font-style:normal}
.rel{display:grid;grid-template-columns:50px 44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.rel .day{text-align:center;line-height:1}
.rel .day b{display:block;font:26px/1 var(--fd)}
.rel .day span{font-size:12px;color:var(--ink3);font-weight:700}
.rel .cv{border-radius:3px}
.rel .t{font-weight:700;line-height:1.25}
.rel .t span{display:block;font-weight:500;font-size:13px;color:var(--ink3)}
.rel .p{display:grid;justify-items:end;gap:6px;font-weight:700;white-space:nowrap}
.rel.own .t{color:var(--ink3)}
.mini{display:inline-flex;align-items:center;gap:4px;min-height:30px;padding:0 9px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:12.5px;font-weight:700;color:var(--ink2)}
.mini.on{background:var(--red);border-color:var(--red);color:#fff}
.mini.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.months{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 0 12px;scrollbar-width:none}
.months::-webkit-scrollbar{display:none}
.mchip{flex:none;scroll-snap-align:start;min-width:108px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);text-align:left;color:inherit}
.mchip b{display:block;font-size:13px;color:var(--ink2)}
.mchip strong{display:block;margin-top:3px;font:19px/1.1 var(--fd);white-space:nowrap}
.mchip span{font-size:12px;color:var(--ink3);font-weight:700}
.mchip.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mchip.over strong{color:var(--red)}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:10px 0 6px}
@media(min-width:760px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{padding:16px;border-radius:var(--r);background:var(--bg2);min-width:0}
@media(max-width:400px){.tile{padding:14px 12px}.tiles.three .tile{padding:11px 9px}}
.tile b{display:block;font:clamp(26px,7.4vw,38px)/1 var(--fd);white-space:nowrap}
.tile span{display:block;margin-top:8px;font-size:13.5px;line-height:1.3;font-weight:700;color:var(--ink2);overflow-wrap:break-word}
.tile small{display:block;font-size:12.5px;color:var(--ink3)}
.tile.dark{background:var(--ink);color:var(--bg)}
.tile.dark span,.tile.dark small{color:inherit;opacity:.72}
.bars{display:grid;grid-template-columns:repeat(var(--n,12),minmax(0,1fr));gap:5px;align-items:end;height:160px;margin-top:12px}
.bars div{display:flex;flex-direction:column;justify-content:flex-end;height:100%;text-align:center}
.bars i{display:block;background:var(--ink);border-radius:4px 4px 0 0;min-height:2px}
.bars i.hot{background:var(--red)}
.bars em{font-size:10.5px;font-style:normal;color:var(--ink3);font-weight:700;margin-top:5px;white-space:nowrap}
.bars u{display:block;font-size:10.5px;text-decoration:none;font-weight:700;margin-bottom:3px;color:var(--ink2);white-space:nowrap}
.hrow{display:grid;grid-template-columns:minmax(0,11em) minmax(48px,1fr) auto;gap:10px;align-items:center;padding:7px 0;font-size:14px}
.hrow .track{height:12px;border-radius:6px;background:var(--line);overflow:hidden}
.hrow .track i{display:block;height:100%;background:var(--ink);border-radius:6px}
.hrow .track i.ok{background:var(--ok)}
.hrow b{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.hrow .nm{font-weight:700;line-height:1.25;overflow-wrap:break-word;-webkit-hyphens:auto;hyphens:auto}
@media(min-width:900px){.statgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 16px;align-items:start}}

/* list */
.li{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.li .cv{border-radius:3px}
.li b{display:block;line-height:1.25}
.li span{font-size:13px;color:var(--ink3)}
.vchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vchip{min-height:34px;padding:0 11px;border-radius:9px;border:1.5px dashed var(--ink3);background:transparent;font-weight:700;font-size:13.5px;color:var(--ink2)}
.sum{display:flex;justify-content:space-between;align-items:baseline;padding:14px 0;font-weight:700}
.sum b{font:24px/1 var(--fd)}

/* scanner */
.scanner{position:fixed;inset:0;z-index:80;background:#000;color:#fff;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scan-top{position:relative;z-index:3;display:flex;justify-content:space-between;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
.scan-top h2{font:18px/1 var(--fd);margin:0}
.scan-top .iconbtn{color:#fff}
.aim{position:absolute;z-index:1;left:50%;top:38%;width:min(84vw,560px);height:min(24vh,200px);transform:translate(-50%,-50%);border-radius:18px;box-shadow:0 0 0 100vmax rgba(0,0,0,.42),inset 0 0 0 2px rgba(255,255,255,.8);transition:box-shadow .2s}
.aim i{position:absolute;left:7%;right:7%;top:50%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:sweep 1.4s ease-in-out infinite alternate}
@keyframes sweep{from{transform:translateY(-55px)}to{transform:translateY(55px)}}
.aim.hit{box-shadow:0 0 0 100vmax rgba(0,0,0,.42),inset 0 0 0 4px #3ccf7d}
.nocam .aim{display:none}
.scan-bottom{position:relative;z-index:3;margin-top:auto;padding:12px max(12px,env(safe-area-inset-right)) calc(14px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));background:linear-gradient(transparent,rgba(0,0,0,.8) 28%)}
.scan-msg{text-align:center;font-weight:700;margin:0 auto 12px;max-width:34em;text-wrap:balance}
.scan-actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.scan-actions .btn{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.22);color:#fff}
.scan-actions .btn.on{background:#fff;color:#000}
.scan-card{max-width:560px;margin:0 auto 12px;background:var(--bg);color:var(--ink);border-radius:18px;padding:16px;max-height:64vh;overflow:auto;box-shadow:var(--shadow)}
.scan-card h3{margin:0 0 4px;font:20px/1.15 var(--fd)}
.scan-log{display:flex;gap:6px;overflow-x:auto;margin:0 auto 10px;max-width:560px;scrollbar-width:none}
.scan-log span{flex:none;padding:6px 10px;border-radius:999px;background:rgba(255,255,255,.16);font-size:12.5px;font-weight:700}
.scan-log span.ok{background:#13814a}.scan-log span.dup{background:#b4462f}
.found{display:grid;grid-template-columns:64px minmax(0,1fr);gap:12px;align-items:center;margin:6px 0 12px}
.found .cv{border-radius:4px}

/* toast */
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));z-index:95;display:flex;align-items:center;gap:14px;max-width:calc(100% - 28px);width:max-content;padding:11px 12px 11px 16px;border-radius:14px;background:var(--ink);color:var(--bg);font-weight:700;box-shadow:var(--shadow);opacity:0;transform:translate(-50%,16px);pointer-events:none;transition:opacity .22s,transform .22s}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast span{flex:1 1 auto}
.toast button{flex:none;border:0;background:transparent;color:var(--red);font-weight:900;min-height:34px;padding:0 6px}
.scan-open .toast{top:calc(env(safe-area-inset-top) + 64px);bottom:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media(min-width:700px){.brand h1{font-size:24px}}
</style>
</head>

<header class="top" id="top">
  <a class="brand" href="#regal" aria-label="Manga-Regal, zum Regal"><span class="hanko" aria-hidden="true">巻</span><h1>Manga-Regal</h1></a>

    <button class="iconbtn wishbtn" data-a="wish" aria-label="Wunschliste"><svg class="ic"><use href="#i-heart"/></svg><b class="badge" id="wishBadge" hidden></b></button>
    <button class="iconbtn" data-a="addSeries" aria-label="Reihe hinzufügen"><svg class="ic"><use href="#i-plus"/></svg></button>

   oder alle, wenn bei der Reihe „Neue Bände in Termine“ an ist */

  const out = [];

    for (const v of Object.values(s.volumes)) {
      if (v.owned) {
        const sp = spentPrice(s, v); if (sp != null) prices.push(sp);
        if (v.bought) { const mo = months.find(x => v.bought.startsWith(x.p)); if (mo) { mo.n++; mo.sum += sp || 0; } if (v.bought.startsWith(year)) { yearN++; yearSum += sp || 0; } } else noDate++;

const Scan = {
  stream: null, timer: 0, busy: false, paused: false, last: { code: '', t: 0 }, pending: { code: '', t: 0 }, log: [], ac: null, torch: false,
  async open() {
    const sc = $('#scanner');
    sc.hidden = false; document.body.classList.add('noscroll', 'scan-open');
    this.log = []; $('#scanLog').innerHTML = ''; this.card(null); this.msg('Kamera wird gestartet …');
    $('#contBtn').classList.toggle('on', !!LOC.cont); $('#contBtn').setAttribute('aria-pressed', !!LOC.cont);
    try { this.ac = this.ac || new (window.AudioContext || window.webkitAudioContext)(); this.ac.resume?.(); } catch {}
    if (!navigator.mediaDevices?.getUserMedia || !window.isSecureContext) { this.noCam('Live-Kamera braucht eine https-Adresse. Fotografiere den Barcode oder tippe die ISBN.'); return; }
    try {
      this.stream = await navigator.mediaDevices.getUserMedia({ audio: false, video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } } });
    } catch (e) { this.noCam(e.name === 'NotAllowedError' ? 'Kamerazugriff verweigert. Erlaube die Kamera in den Einstellungen – oder nutze Foto bzw. ISBN.' : 'Keine Kamera verfügbar. Fotografiere den Barcode oder tippe die ISBN.'); return; }
    if ($('#scanner').hidden) { this.stopCam(); return; }
    const vid = $('#cam'); vid.srcObject = this.stream;
    try { await vid.play(); } catch {}
    sc.classList.remove('nocam');
    const track = this.stream.getVideoTracks()[0];
    try { const caps = track.getCapabilities?.() || {}; $('#torchBtn').hidden = !caps.torch; $('#torchSpacer').hidden = !!caps.torch; if (caps.focusMode?.includes('continuous')) track.applyConstraints({ advanced: [{ focusMode: 'continuous' }] }).catch(() => {}); } catch {}
    this.msg('Barcode auf der Rückseite in den Rahmen halten');
    this.paused = false; this.loop();
  },
  noCam(text) { $('#scanner').classList.add('nocam'); this.msg(text); },
  msg(t) { $('#scanMsg').textContent = t; },
  card(html) { const c = $('#scanCard'); c.hidden = !html; c.innerHTML = html || ''; $('#scanMsg').hidden = !!html; if (html) c.scrollTop = 0; },
  loop() {
    clearTimeout(this.timer);
    this.timer = setTimeout(() => {
      if ($('#scanner').hidden || !this.stream) return;
      if (!this.paused && !this.busy && document.visibilityState === 'visible') this.tick();
      this.loop();
    }, 110);
  },
  tick() {
    const vid = $('#cam'), vw = vid.videoWidth, vh = vid.videoHeight;
    if (!vw || !vh) return;
    const portrait = vh > vw;
    const cw = Math.round(vw * (portrait ? 0.92 : 0.7)), ch = Math.round(Math.min(vh * (portrait ? 0.34 : 0.5), cw * 0.62));
    const sx = (vw - cw) >> 1, sy = Math.round((vh - ch) * (portrait ? 0.42 : 0.45));
    const sc = Math.min(1, 1280 / cw), W = Math.round(cw * sc), H = Math.round(ch * sc);
    const cv = $('#cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
    cv.width = W; cv.height = H;
    ctx.drawImage(vid, sx, sy, cw, ch, 0, 0, W, H);
    const r = EAN13.decode(EAN13.gray(ctx.getImageData(0, 0, W, H)), W, H, { angles: [0, 6, 174, 12, 168, 90], enough: 2, step: Math.max(4, Math.round(H / 40)) });
    if (!r || !/^97[89]/.test(r.code)) return;
    const now = Date.now();
    if (r.votes < 2 && !(this.pending.code === r.code && now - this.pending.t < 1500)) { this.pending = { code: r.code, t: now }; return; }
    if (this.last.code === r.code && now - this.last.t < 3500) return;
    this.last = { code: r.code, t: now };
    this.hit(r.code);
  },
  beep(ok = true) {
    try { const ac = this.ac; if (!ac) return; const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = ok ? 1320 : 440; g.gain.value = 0.12; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + (ok ? 0.09 : 0.22)); } catch {}
    try { navigator.vibrate?.(ok ? 40 : [60, 40, 60]); } catch {}
  },
  hit(code) {
    const aim = $('#aim'); aim.classList.add('hit'); setTimeout(() => aim.classList.remove('hit'), 500);
    this.beep(true);
    handleCode(code, !!LOC.cont);
  },
  addLog(text, cls) { this.log.unshift({ text, cls }); $('#scanLog').innerHTML = this.log.slice(0, 20).map(l => `<span class="${l.cls || ''}">${esc(l.text)}</span>`).join(''); },
  stopCam() { clearTimeout(this.timer); if (this.stream) for (const t of this.stream.getTracks()) t.stop(); this.stream = null; $('#cam').srcObject = null; },
  close() { this.stopCam(); $('#scanner').hidden = true; $('#scanner').classList.remove('nocam'); this.card(null); document.body.classList.remove('scan-open'); if (!sheets.length) document.body.classList.remove('noscroll'); },
  async setTorch() { try { const t = this.stream?.getVideoTracks()[0]; this.torch = !this.torch; await t.applyConstraints({ advanced: [{ torch: this.torch }] }); $('#torchBtn').classList.toggle('on', this.torch); } catch { toast('Licht wird hier nicht unterstützt'); } },
};
async function decodeFile(file) {
  let img;
  try { img = await createImageBitmap(file); }
  catch { img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); }); }
  const w = img.width, h = img.height;
  if ('BarcodeDetector' in window) {
    try { const bd = new window.BarcodeDetector({ formats: ['ean_13'] }); const res = await bd.detect(img); const hit = res.find(x => /^97[89]\d{10}$/.test(x.rawValue)); if (hit) return hit.rawValue; } catch {}
  }
  const cv = $('#cv'), ctx = cv.getContext('2d', { willReadFrequently: true });
  for (const max of [1600, 2600, 1000]) {
    const sc = Math.min(1, max / Math.max(w, h)), W = Math.round(w * sc), H = Math.round(h * sc);
    cv.width = W; cv.height = H; ctx.drawImage(img, 0, 0, W, H);
    await sleep(10);
    const r = EAN13.decode(EAN13.gray(ctx.getImageData(0, 0, W, H)), W, H);
    if (r && /^97[89]/.test(r.code)) return r.code;
    if (sc === 1 && max >= 1600) break;
  }
  return null;
}

/* --- scan result handling --- */
function scanTarget() { return !$('#scanner').hidden ? 'scan' : 'sheet'; }
async function handleCode(isbn, auto) {
  isbn = normIsbn(isbn);
  if (!isbn) { Scan.msg('Das ist keine gültige ISBN.'); Scan.beep(false); return; }
  const hit = findIsbn(isbn);
  if (hit) {
    const name = `${hit.s.title} ${hit.k}`;
    if (hit.v.owned) {
      Scan.beep(false); Scan.addLog(name + ' · doppelt', 'dup');
      if (auto) { toast(`${name} steht schon im Regal`); return; }
      Scan.paused = true;
      Scan.card(`<h3>Schon im Regal</h3><div class="found">${miniCover(hit.s, hit.v)}<div><b>${esc(name)}</b><div class="small muted">ISBN ${esc(isbn)}${hit.v.bought ? ' · gekauft ' + esc(fmtDate(hit.v.bought)) : ''}</div></div></div><div class="row"><button class="btn dark" data-a="scanResume">Weiter scannen</button><button class="btn" data-a="openVolFromScan" data-id="${esc(hit.s.id)}" data-n="${esc(hit.k)}">Band öffnen</button></div>`);
      return;
    }
    if (auto) { change(hit.s.id, s => own(s, hit.k), `${name} ins Regal gestellt`); Scan.addLog(name, 'ok'); return; }
    Scan.paused = true;
    Scan.card(foundCard(hit.s, hit.k, hit.v, isbn, ''));
    return;
  }
  if (auto) {
    D().inbox[isbn] = { isbn, t: Date.now() }; commit();
    Scan.addLog('Neu · ' + isbn.slice(-6), '');
    toast('Neuer Band im Eingang');
    lookupIsbn(isbn).then(g => {
      const it = D().inbox[isbn]; if (!it || !g) return;
      const s = g.src === 'Manga Passion' && g.sid && g.number != null ? D().series[g.sid] : null;
      if (s) {
        change(s.id, x => { setVol(x, g.number, { isbn, ed: g.ed || undefined }); own(x, g.number); });
        delete D().inbox[isbn]; D().deleted['inbox:' + isbn] = Date.now(); commit();
        toast(`${s.title} ${g.number} ins Regal gestellt`); Scan.addLog(`${s.title} ${g.number}`, 'ok');
        return;
      }
      if (g.title || g.number != null) { it.guess = { title: g.title, number: g.number, cover: g.cover, sid: g.sid, price: g.price, date: g.date, publisher: g.publisher, mp: g.mp, ed: g.ed, src: g.src }; it.t = Date.now(); commit(); }
    }).catch(() => {});
    return;

async function shareOrDownload(file) {
  if (navigator.canShare?.({ files: [file] })) { try { await navigator.share({ files: [file], title: file.name }); return; } catch (e) { if (e.name === 'AbortError') return; } }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = file.name; document.body.append(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 3000);
}

}

  if (t.dataset.sf === 'wfol' || t.dataset.sf === 'physWant') {
